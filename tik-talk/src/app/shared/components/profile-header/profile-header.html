@if (profile(); as profile) {
@if(profile.avatarUrl) {
<img [src]="baseApiUrl + '/' + profile.avatarUrl" alt="avatar" class="profile--header__avatar">
} @else {
<img src="/assets/images/avatar-placeholder.jpg" alt="avatar" class="profile--header__avatar">
}

<div class="profile--header__name--container">
    <span class="profile--header__name">{{ profile.firstName }} {{ profile.lastName }}</span>
    <span class="profile--header__nickname">{{ profile.username }}</span>
</div>
}
